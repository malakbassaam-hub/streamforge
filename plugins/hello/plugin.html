<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <style>
      :root { --accent: #5be0b0; --surface: rgb(17 24 32 / 94%); --text: #f3f6f4; --muted: #c8d5cf; --border: #65caa2; --fontFamily: "Segoe UI", sans-serif; }
      html,body{background:transparent}
      body {
        margin: 0;
        color: var(--text);
        font: 15px var(--fontFamily);
      }
      #message {
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: 0 8px 24px rgb(0 0 0 / 20%);
        overflow-wrap: anywhere;
      }
      strong { color: var(--accent); }
    </style>
  </head>
  <body dir="auto">
    <div id="message">Waiting for chat...</div>
    <script>
      const message = document.querySelector("#message");
      window.addEventListener("message", event => {
        if (event.source !== parent) return;
        const data = event.data;
        if (data?.type === "theme" && data.tokens) {
          for (const key of ["accent", "surface", "text", "muted", "border", "fontFamily"]) {
            if (typeof data.tokens[key] === "string") document.documentElement.style.setProperty('--' + key, data.tokens[key]);
          }
          return;
        }
        if (data?.type !== "chat.message" || typeof data.text !== "string") return;
        message.replaceChildren();
        const user = document.createElement("strong");
        user.textContent = typeof data.user === "string" ? data.user : "Viewer";
        message.append(user, document.createTextNode(`: ${data.text}`));
      });
    </script>
  </body>
</html>
